[project]
name = "markterm"
version = "0.1.0"
description = "Render Markdown as beautiful, syntax-highlighted terminal output, powered by Rich."
readme = "README.md"
authors = [{ name = "Estêvão Fonseca", email = "estevaopfon@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.2.0",
    "rich>=15.0.0",
]

[project.scripts]
markterm = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]
